<!doctype html>
<!-- itch.io page banner, 960x300 (rendered 1x and 2x). Render with tools/page-art/render.ps1 -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>

.logo{position:absolute;left:34px;top:12px;text-align:center}
.logo .main{font-size:118px}

.tag{position:absolute;left:60px;bottom:24px}

<div class="card" style="left:480px;top:195px;transform:rotate(12deg) scale(.6);opacity:.8;--suit:'♦'"></div>
<span class="spark" style="left:530px;top:95px;font-size:14px">✦</span>

<span class="spark" style="left:435px;top:70px;font-size:12px">✦</span>

<div class="logo">
  <div class="top">MIKU</div>
