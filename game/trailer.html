<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every World Has a You</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<!-- The Story Mode trailer: three minutes, built from the game's own sprites, backgrounds and music (STORY.md).
     Plagued characters are drawn on canvases (Fx below) so they can slit-scan, smear, melt, twitch and stretch.
     It opens as a happy school story and turns: a found tape and an emergency alert (analogue horror), a count that doesn't
     add up, a figure that is closer every time the lights come back, voicemails from a mother, a classroom that has forgotten
     someone, and an ending that talks to the viewer (local time, and it remembers a second viewing). -->
<style>
  :root { --red: #e0263c; --ink: #f4eef2; --dim: #a99aa4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: var(--ink); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: absolute; left: 50%; top: 50%; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh);
    transform: translate(-50%, -50%); overflow: hidden; background: #000; }
  .layer { position: absolute; inset: 0; }
  .bg { position: absolute; inset: -4%; width: 108%; height: 108%; object-fit: cover; opacity: 0; will-change: transform, opacity; }
  canvas.fxbg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  canvas.fxchar { position: absolute; bottom: -2%; transform: translateX(-50%); pointer-events: none; }
  #tint { background: transparent; mix-blend-mode: multiply; pointer-events: none; }
  #vignette { background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.85) 100%); pointer-events: none; }
  #glowSpot { left: 50%; top: 78%; width: 34%; height: 12%; transform: translate(-50%, -50%); border-radius: 50%; inset: auto;
    background: radial-gradient(ellipse, rgba(200,240,255,.95), rgba(120,200,255,.45) 40%, transparent 72%);
    filter: blur(6px); opacity: 0; mix-blend-mode: screen; }
  .char { position: absolute; bottom: -2%; height: 92%; transform: translateX(-50%); opacity: 0; will-change: transform, opacity; }
  .char img { height: 100%; display: block; }
  canvas#fx, canvas#grain { pointer-events: none; }
  canvas#grain { width: 100%; height: 100%; mix-blend-mode: soft-light; opacity: 0; }
  #scan { pointer-events: none; opacity: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.35) 0 1px, transparent 1px 3px); }
  #eyes { pointer-events: none; opacity: 0; }
  .eye { position: absolute; width: 4.4%; aspect-ratio: 2 / 1; border-radius: 50%; background: radial-gradient(circle at var(--px, 50%) var(--py, 50%), #120006 0 22%, #ffd8de 23% 48%, transparent 50%);
    box-shadow: 0 0 1.4vmin rgba(255,60,90,.8); transform: translate(-50%, -50%) scaleY(0); }
  #subliminal { z-index: 5; pointer-events: none; opacity: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #subliminal img { height: 140%; filter: invert(1) contrast(2.2) grayscale(1); }
  #flash { background: #fff; opacity: 0; pointer-events: none; }
  #bars::before, #bars::after { content: ""; position: absolute; left: 0; right: 0; height: 9%; background: #000; z-index: 2; }
  #bars::before { top: 0; } #bars::after { bottom: 0; }
  #sub { position: absolute; left: 10%; right: 10%; bottom: 12%; text-align: center; font-size: clamp(14px, 2.4vmin, 30px);
    line-height: 1.35; text-shadow: 0 2px 6px #000, 0 0 2px #000; opacity: 0; z-index: 3; }
  #sub b { display: block; font-size: .72em; letter-spacing: .25em; text-transform: uppercase; color: var(--dim); margin-bottom: .2em; }
  #card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 8%; z-index: 3; pointer-events: none; }
  #card .line { text-shadow: 0 0 2vmin #000, 0 0 5vmin #000, 0 3px 0 #000; font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(18px, 4.4vmin, 56px); letter-spacing: .04em; opacity: 0; }
  #card .line.small { font-family: system-ui, sans-serif; font-size: clamp(11px, 1.9vmin, 22px); letter-spacing: .5em; text-transform: uppercase; color: var(--dim); margin-top: 1.2em; }
  #card .line.big { font-size: clamp(30px, 9vmin, 120px); font-weight: 700; letter-spacing: .08em; }
  #card .line.red { color: var(--red); }
  #card .line.soft { font-style: italic; color: #e8dce4; }
  #card .line.cute { font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; font-weight: 700; color: #ff8fc8;
    text-shadow: 0 .4vmin 0 #fff, 0 -.4vmin 0 #fff, .4vmin 0 0 #fff, -.4vmin 0 0 #fff, 0 1vmin 2vmin rgba(255,120,190,.6); }
  /* the tape: a VHS overlay (live clock, tracking band, head-switch noise), an emergency alert and a typed terminal */
  #vhs { z-index: 4; opacity: 0; pointer-events: none; font: clamp(12px, 2.8vmin, 34px)/1.2 ui-monospace, Consolas, monospace; color: #f2f2f2;
    text-shadow: 2px 0 rgba(255,0,60,.7), -2px 0 rgba(0,190,255,.7); }
  #vhs .tl, #vhs .lbl { position: absolute; left: 5%; } #vhs .tr, #vhs .clock { position: absolute; right: 5%; text-align: right; }
  #vhs .tl, #vhs .tr { top: 11%; } #vhs .lbl, #vhs .clock { top: 16.5%; font-size: .8em; }
  #vhs .tr { color: #ff3b3b; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #track { position: absolute; left: 0; right: 0; top: -10%; height: 6%; backdrop-filter: blur(1.5px) brightness(1.6) contrast(1.4);
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.1) 0 2px, transparent 2px 7px); }
  #headsw { position: absolute; left: 0; right: 0; bottom: 9%; height: 2.6%; backdrop-filter: blur(2px) hue-rotate(80deg) brightness(1.3);
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 1px, transparent 1px 4px); }
  #eas { z-index: 1; opacity: 0; background: #000; pointer-events: none; }
  #eas .bars { position: absolute; left: 0; right: 0; top: 9%; height: 52%;
    background: linear-gradient(90deg, #bfbfbf 0 14.3%, #bfbf00 0 28.6%, #00bfbf 0 42.9%, #00bf00 0 57.1%, #bf00bf 0 71.4%, #bf0000 0 85.7%, #0000bf 0); }
  #eas .lower { position: absolute; left: 0; right: 0; top: 61%; height: 8%;
    background: linear-gradient(90deg, #0000bf 0 14.3%, #131313 0 28.6%, #bf00bf 0 42.9%, #131313 0 57.1%, #00bfbf 0 71.4%, #131313 0 85.7%, #bfbfbf 0); }
  #eas .crawl { position: absolute; left: 0; right: 0; top: 72%; height: 10%; background: #b00010; overflow: hidden; display: flex; align-items: center;
    font: 700 clamp(14px, 3.6vmin, 44px) ui-monospace, Consolas, monospace; color: #fff; white-space: nowrap; }
  #eas .crawl span { display: inline-block; }
  #term { position: absolute; inset: 24% 10% 15%; font: clamp(11px, 2.6vmin, 30px)/1.55 ui-monospace, Consolas, monospace; color: #e8e8e8; letter-spacing: .03em;
    opacity: 0; pointer-events: none; text-shadow: 2px 0 rgba(255,0,60,.55), -2px 0 rgba(0,190,255,.55); z-index: 3; }
  #term .red { color: #ff3248; } #term .dim { color: #8a8a8a; }
  /* a visual-novel choice that chooses itself */
  #choice { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); display: flex; flex-direction: column; gap: 1.4vmin; z-index: 3; opacity: 0; pointer-events: none; }
  #choice div { min-width: 40vmin; padding: .7em 2em; text-align: center; font: clamp(13px, 2.4vmin, 28px) system-ui, sans-serif; color: #fff;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.55); border-radius: 1vmin; text-shadow: 0 1px 3px #000; }
  #choice div.on { background: rgba(255,130,190,.6); border-color: #fff; }
  #lcd { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); padding: .5em 1em; font: clamp(12px, 2.6vmin, 30px) ui-monospace, Consolas, monospace;
    color: #9dff9d; background: rgba(4,20,8,.85); border: 1px solid #2f7a3f; letter-spacing: .12em; text-shadow: 0 0 8px #3dff6a;
    opacity: 0; z-index: 3; pointer-events: none; white-space: nowrap; }
  #plate { position: absolute; left: 6%; top: 50%; transform: translateY(-50%); z-index: 3; opacity: 0; max-width: 46%; }
  #plate.right { left: auto; right: 6%; text-align: right; }
  #plate .who { font-size: clamp(11px, 1.9vmin, 22px); letter-spacing: .45em; text-transform: uppercase; color: var(--dim); }
  #plate .title { font-family: Georgia, serif; font-size: clamp(22px, 6vmin, 78px); line-height: 1.02; font-weight: 700;
    text-transform: uppercase; color: #fff; text-shadow: 0 0 2vmin rgba(224,38,60,.9), 0 3px 0 #000; }
  #plate .rule { height: .5vmin; width: 0; background: var(--red); margin: 1vmin 0; box-shadow: 0 0 1vmin var(--red); }
  #plate.right .rule { margin-left: auto; }
  #plate .quote { font-style: italic; font-size: clamp(12px, 2.2vmin, 26px); color: #ffd9de; opacity: .9; }
  #binary { position: absolute; inset: 0; font: clamp(9px, 1.5vmin, 16px)/1.25 ui-monospace, Consolas, monospace; color: #7dffb0;
    opacity: 0; white-space: normal; overflow: hidden; text-shadow: 0 0 6px #2bff88; pointer-events: none; padding: 2%; word-break: break-all; }
  #deck { position: absolute; inset: 0; pointer-events: none; }
  #deck img { position: absolute; width: 9%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; border-radius: 1vmin;
    border: .35vmin solid #fff; box-shadow: 0 0 2vmin rgba(160,220,255,.8); opacity: 0; background: #223; }
  #gate { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vmin;
    background: radial-gradient(ellipse at center, #1a0a14, #000 70%); text-align: center; padding: 16px; }
  #gate h1 { font-family: Georgia, serif; font-size: clamp(26px, 6vmin, 64px); letter-spacing: .06em; }
  #gate p { color: var(--dim); font-size: clamp(12px, 2vmin, 18px); letter-spacing: .3em; text-transform: uppercase; }
  #gate button { font: inherit; font-size: clamp(14px, 2.4vmin, 22px); letter-spacing: .3em; text-transform: uppercase; color: #fff;
    background: transparent; border: 1px solid var(--red); padding: 1.2em 2.6em; cursor: pointer; box-shadow: 0 0 2vmin rgba(224,38,60,.5); }
  #gate button:disabled { opacity: .4; cursor: wait; }
  #gate button:hover:not(:disabled) { background: rgba(224,38,60,.18); }
  #progress { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--red); z-index: 4; opacity: .7; }
  #skip { position: fixed; right: 16px; bottom: 14px; z-index: 6; background: rgba(0,0,0,.5); color: var(--dim); border: 1px solid #444;
    font: 12px system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; padding: 8px 12px; cursor: pointer; display: none; }
</style>
</head>
<body>
<div id="stage"><div class="layer" id="cam">
  <img class="bg" id="bgA" alt=""><img class="bg" id="bgB" alt="">
  <div class="layer" id="bgfx"></div>
  <div class="layer" id="glowSpot"></div>
  <div class="layer" id="eyes"></div>
  <div class="layer" id="chars"></div>
  <div class="layer" id="tint"></div>
  <canvas class="layer" id="fx"></canvas>
  <div class="layer" id="vignette"></div>
  <div id="deck"></div>
  <div id="binary"></div>
  <div id="plate"><div class="who"></div><div class="rule"></div><div class="title"></div><div class="quote"></div></div>
  <div class="layer" id="eas"><div class="bars"></div><div class="lower"></div><div class="crawl"><span></span></div></div>
  <div id="term"></div>
  <div id="lcd"></div>
  <div id="choice"></div>
  <div id="card"></div>
  <div id="sub"></div>
  <div class="layer" id="scan"></div>
  <canvas class="layer" id="grain" width="480" height="270"></canvas>
  <div class="layer" id="vhs"><div class="tl">▶ PLAY</div><div class="tr">● REC</div><div class="lbl"></div><div class="clock"></div><div id="track"></div><div id="headsw"></div></div>
  <div class="layer" id="subliminal"><img alt=""></div>
  <div class="layer" id="bars"></div>
  <div class="layer" id="flash"></div>
  <div id="progress"></div>
</div></div>
<div id="gate">
  <p>Miku Battle · Story Mode</p>
  <h1>Every World Has a You</h1>
  <button id="play" disabled>Loading 0%</button>
  <p id="gateNote" style="letter-spacing:.15em;text-transform:none">Trailer · 3:00 · sound on</p>
</div>
<button id="skip">Esc · stop</button>

<script src="lib/gsap.min.js"></script>
<script src="js/config.js"></script>
<script src="assets/manifest.js"></script>
<script>
(function () {
  const M = window.MIKU_MANIFEST;
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');

  // ---------------------------------------------------------------- assets
  const charById = Object.fromEntries(M.characters.map((c) => [c.id, c]));
  const bgByName = (name) => M.backgrounds.find((b) => b.name.trim().toLowerCase() === name.toLowerCase());
  const sprite = (id, role) => { const c = charById[id]; return c ? MB.asset(c.sprites[role] || c.sprites.idle) : ''; };
  const bgUrl = (name) => { const b = bgByName(name); return b ? MB.asset(b.src) : ''; };
  const trackUrl = (id) => (M.music.find((m) => m.id === id) || {}).url;
  // Horror "worst self" portraits (generated art, same-origin under assets/local/trailer/). Characters listed here use
  // their portrait for the plagued shots; everyone else gets the effects on their normal sprite.
  // Made with Codex image generation from each character's own sprite (keys: 'id' or 'id:role').
  const HORROR_ART = Object.fromEntries(['james-lone', 'maiko-ghan', 'kayla-kate', 'diana', 'rirarra-charca', 'lilith', 'miss-mireille', 'keiko-cries',
    'shogun-kagetora', 'valse', 'daphne', 'maria-hunley', 'milo'].map((id) => [id, `local/trailer/${id}.webp`])
    .concat([['doe:special', 'local/trailer/doe-special.webp'], ['doe:lose', 'local/trailer/doe-lose.webp']]));
  const horror = (id, role) => { const a = HORROR_ART[`${id}:${role}`] || HORROR_ART[id]; return a ? MB.asset(a) : sprite(id, role); };
  const images = new Map(); // url -> loaded Image, filled by the preloader
  const image = (url) => { if (!images.has(url)) { const i = new Image(); i.src = url; images.set(url, i); } return images.get(url); };

  // ---------------------------------------------------------------- sound: music tracks and a small synth
  let ac, master, current = null; const live = new Set();
  function audioInit() { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination); }
  function music(id, vol = 0.8, fade = 1.2) {
    if (current) { const old = current; gsap.to(old, { volume: 0, duration: fade, onComplete: () => old.pause() }); current = null; }
    if (!id) return;
    const a = new Audio(trackUrl(id)); a.loop = true; a.volume = 0;
    a.play().then(() => gsap.to(a, { volume: vol, duration: fade })).catch(() => {});
    current = a;
  }
  // the tape slows down: the track drops in speed and pitch together
  function musicRate(rate, dur) {
    if (!current) return; const a = current;
    a.preservesPitch = a.mozPreservesPitch = a.webkitPreservesPitch = false;
    gsap.to(a, { playbackRate: rate, duration: dur, ease: 'power1.in' });
  }
  // dead silence: the music stops and every sound is muted for dur seconds
  function hush(dur) {
    if (current) { current.pause(); current = null; }
    if (!ac) return; const t = ac.currentTime;
    master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(0.0001, t); master.gain.setValueAtTime(0.7, t + dur);
  }
  function noise(dur, vol, f, sweep, type = 'lowpass', delay = 0) {
    const t = ac.currentTime + delay, buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate);
    const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(); s.buffer = buf;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); if (sweep) fl.frequency.exponentialRampToValueAtTime(sweep, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(master); s.start(t);
  }
  function tone(f0, f1, dur, vol, type = 'sine', delay = 0) {
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  // a low detuned drone that breathes; returns a stop function
  function drone(vol = 0.16) {
    const t = ac.currentTime, out = ac.createGain(), lp = ac.createBiquadFilter(), lfo = ac.createOscillator(), lg = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 260; lfo.frequency.value = 0.18; lg.gain.value = 140; lfo.connect(lg); lg.connect(lp.frequency);
    out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(vol, t + 3);
    const oscs = [41.2, 41.6, 61.7, 82.9].map((f) => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(t); return o; });
    lp.connect(out); out.connect(master); lfo.start(t);
    const stop = () => { if (!live.has(stop)) return; const n = ac.currentTime; out.gain.cancelScheduledValues(n); out.gain.setValueAtTime(out.gain.value, n); out.gain.exponentialRampToValueAtTime(0.0001, n + 1.5); [...oscs, lfo].forEach((o) => o.stop(n + 1.6)); live.delete(stop); };
    live.add(stop); return stop;
  }
  const SFX = {
    boom: () => { tone(90, 28, 1.6, 0.9); noise(1.2, 0.5, 400, 40); },
    hit: () => { tone(140, 40, 0.5, 0.7); noise(0.35, 0.5, 1200, 120); },
    whoosh: () => noise(0.45, 0.35, 300, 3000, 'bandpass'),
    glitch: () => { for (let i = 0; i < 6; i++) tone(200 + Math.random() * 1800, 0, 0.04, 0.12, 'square', i * 0.045); noise(0.25, 0.25, 4000, 0, 'highpass'); },
    riser: () => { tone(120, 1400, 3.2, 0.18, 'sawtooth'); noise(3.2, 0.12, 400, 6000, 'bandpass'); },
    heart: () => { tone(60, 40, 0.18, 0.9); tone(55, 38, 0.2, 0.7, 'sine', 0.24); },
    shimmer: () => [0, 0.08, 0.16, 0.24, 0.32].forEach((d, i) => tone(1200 + i * 260, 0, 0.5, 0.06, 'sine', d)),
    paper: () => noise(0.3, 0.2, 2500, 6000, 'highpass'),
    melt: () => { tone(320, 28, 0.9, 0.25, 'sawtooth'); tone(330, 30, 0.9, 0.2, 'sawtooth'); noise(0.9, 0.2, 2000, 80); },  // tape stop
    sting: () => { tone(1900, 1700, 0.5, 0.12, 'square'); tone(2400, 2100, 0.5, 0.1, 'sawtooth'); noise(0.3, 0.4, 6000, 0, 'highpass'); },
    flatline: () => tone(1000, 0, 2.4, 0.14),
    eas: () => [853, 960].forEach((f) => {  // the two-tone emergency alert, flat for three seconds
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f;
      g.gain.setValueAtTime(0.08, t); g.gain.setValueAtTime(0.08, t + 3.2); g.gain.linearRampToValueAtTime(0, t + 3.3);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 3.4);
    }),
    tick: () => tone(2200, 0, 0.02, 0.025, 'square'),
    beep: () => tone(1000, 0, 0.45, 0.12),
    click: () => { noise(0.05, 0.4, 3000, 0, 'highpass'); tone(80, 40, 0.08, 0.4); },
    breath: () => noise(1.6, 0.18, 700, 1800, 'bandpass'),
    plip: () => { tone(1500, 500, 0.12, 0.12); tone(900, 400, 0.18, 0.05, 'sine', 0.03); },
    chomp: () => { noise(0.25, 0.8, 900, 120); tone(200, 50, 0.25, 0.9); tone(2600, 0, 0.03, 0.2, 'square', 0.02); tone(2400, 0, 0.03, 0.2, 'square', 0.09); },
    squelch: () => { noise(0.5, 0.35, 500, 90); tone(110, 45, 0.45, 0.35); },
    roar: () => { noise(3.2, 0.35, 250, 900); noise(3.2, 0.12, 2000, 600, 'bandpass'); },
    ice: () => { for (let i = 0; i < 5; i++) tone(2400 + Math.random() * 2400, 0, 0.05, 0.05, 'triangle', i * 0.07 + Math.random() * 0.05); noise(0.2, 0.15, 5000, 0, 'highpass'); },
    shatter: () => { noise(1.4, 0.6, 7000, 1500, 'highpass'); for (let i = 0; i < 14; i++) tone(2000 + Math.random() * 4000, 0, 0.12, 0.07, 'triangle', Math.random() * 0.6); tone(90, 30, 0.6, 0.6); },
    // a voice made of two sawtooths with a shaking pitch, through a mouth-shaped band, rising and breaking
    scream: () => {
      const t = ac.currentTime, out = ac.createGain(), bp = ac.createBiquadFilter(), lfo = ac.createOscillator(), lg = ac.createGain();
      bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 1.6; lfo.frequency.value = 7; lg.gain.value = 40; lfo.connect(lg);
      out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(0.5, t + 0.15); out.gain.setValueAtTime(0.5, t + 2.1); out.gain.exponentialRampToValueAtTime(0.0001, t + 2.7);
      [520, 790].forEach((f) => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.6, t + 2.2); lg.connect(o.frequency); o.connect(bp); o.start(t); o.stop(t + 2.8); });
      bp.connect(out); out.connect(master); lfo.start(t); lfo.stop(t + 2.8); noise(2.6, 0.12, 3000, 1200, 'bandpass');
    },

  // ---------------------------------------------------------------- start, end, preload
  // after the first full viewing the gate is no longer quite the same
  function haunt() {
    if (!views) return;
    document.title = 'Every World Had a You';
    $('gate').querySelector('h1').textContent = 'Every World Had a You';

    $('skip').style.display = 'none';
    const g = $('gate'); g.style.display = 'flex'; gsap.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.8 });
    $('play').textContent = 'Watch again';

    $('skip').style.display = 'block';
    clearChars(0); killFx(); particles(null); $('card').innerHTML = ''; tint('rgba(0,0,0,0)', 0);
    tl.restart();
  };
  $('skip').onclick = () => end();
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && tl.isActive()) end(); });

  // load every picture before the first frame so nothing pops in late
  const urls = new Set();
  ['beach night', 'Karate Fighting ring (Beginners)', 'Fire..', 'Ice Cave', 'school roof', 'Classroom', 'Lab A-3 - Night', 'Bedroom - Night', 'Bonfire Beach', 'dark castle entrance', 'Doe Earth 2', 'Your bedroom', 'Lab B-2 Earth 7 Rift', 'Outside the prom',

    .concat(reveals.map((r) => r[2])).forEach((n) => urls.add(bgUrl(n)));
  [['hayley-kate', 'play'], ['hayley-kate', 'idle'], ['hayley-kate', 'win'], ['hayley-kate', 'hurt'], ['hayley-kate', 'special'], ['james-lone', 'idle'], ['james-lone', 'play'],
    ['kayla-kate', 'idle'], ['doe', 'win'], ['doe', 'lose'], ['doe', 'taunt'], ['marija', 'taunt'], ['celeste', 'special'], ['lumin', 'hurt'], ['lilith', 'lose'],

  // ?autoplay starts as soon as everything is loaded (muted until a click, browsers block sound before one); ?t=SECONDS plays the 4 s before it (for checking a shot; &hold stops there)
  const params = new URLSearchParams(location.search), auto = params.has('autoplay') || params.has('t');

  const tick = () => { done++; btn.textContent = `Loading ${Math.round(done / total * 100)}%`; if (done === total) ready(); };
